    - "Persistência atômica das mensagens preservada (File.Replace com arquivo temporário)."
    - "Separação estrita de autoridade: o agente NÃO altera o system_index.md (fatos confirmados); o agente só anota em agent_index.md e scratchpad.md."
    - "Zero overhead de GPU no motor do sistema: a extração de fatos é orientada a eventos de tools em C#."
