definition_of_done:
  expected_behavior:
    - "1. Ao criar uma conversa, o ConversationStore cria a pasta `backend/data/conversations/{id}/` contendo conversation.json, system_index.md, intent.md, facts.md, agent_index.md e scratchpad.md."
    - "2. Todas as conversas antigas de teste (*.json soltos) são removidas da pasta."
    - "3. Ferramentas expostas ao modelo: `topic_read(name)` e `topic_write(name, content)` para o agente manipular seu próprio scratchpad."
    - "4. Injeção dinâmica no System Prompt: carregar apenas os dois índices compactos (~120 tokens no total)."
    - "5. O motor C# atualiza facts.md automaticamente a partir de sucessos das tools."
  validation_criteria:
