  description: "Migrar armazenamento de conversas para micropasta por conversa (backend/data/conversations/{id}/), implementar o Dual-Index (system_index.md com facts/intent via backend vs agent_index.md com scratchpad via ferramentas), injetar índices no System Prompt e resetar conversas antigas de teste."
  files_allowed:
