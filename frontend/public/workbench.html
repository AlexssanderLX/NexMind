 pontos de entrada para a leitura.",detail:"Use a tela inicial para escolher se você quer começar pela superfície observada, por uma hipótese ou pelo índice metodológico. Ela orienta; não registra um pentest."},{term:"Etapas",summary:"Sequência de raciocínio da observação até a evidência.",detail:"As etapas organizam a investigação. Elas não são categorias de vulnerabilidade e podem ser reutilizadas em qualquer alvo web ou API autorizado."},{term:"Técnicas",summary:"Biblioteca pesquisável de hipóteses e testes.",detail:"Aqui ficam os conteúdos técnicos: sinais, padrões, teste mínimo, leitura de código, interpretação, impacto e fontes. É o catálogo principal do Workbench."},{term:"Índice WSTG",summary:"Atalho por área oficial da metodologia.",detail:"O índice lateral filtra o catálogo de técnicas pelas áreas do WSTG. A contagem mostra quantos cenários possuem conteúdo detalhado em relação ao total oficial."},{term:"Cobertura",summary:"Proporção de conteúdo detalhado, não resultado de um alvo.",detail:"Uma marca como 4/10 significa que quatro cenários daquela área foram detalhados neste atlas. Não significa quatro vulnerabilidades encontradas nem quarenta por cento de segurança."},{term:"Severidade",summary:"Referência para raciocinar sobre impacto e prioridade.",detail:"A tela compara escalas como CVSS e P1–P5. A classificação final depende do impacto demonstrado, das pré-condições e das regras de cada programa."},{term:"Fontes",summary:"Rastreabilidade para documentos oficiais.",detail:"Use as fontes para conferir versão, escopo e definição original dos guias. O conteúdo do atlas resume e organiza; a referência oficial continua sendo a autoridade."},{term:"Conteúdo estático",summary:"Leitura interativa, sem backend e sem armazenamento.",detail:"Filtros, abas e expansões funcionam somente no navegador. O Workbench não executa testes, não envia requisições e não salva dados de um alvo."}]},{id:"reasoning",title:"Lógica das etapas",description:"Conceitos que conectam e
